<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ball-Balancer — Caliburn</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #14141a; }
#canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    outline: none;
}
#loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #14141a;
    color: #a0a0b0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    z-index: 10;
    transition: opacity 0.3s;
}
#loading h1 { font-size: 1.3rem; margin-bottom: 1rem; color: #e0e0f0; }
#progress-bar {
    width: 240px; height: 6px;
    background: #2a2a3a; border-radius: 3px;
    overflow: hidden;
}
#progress-fill {
    height: 100%; width: 0%;
    background: #38bdf8; border-radius: 3px;
    transition: width 0.15s;
}
#status { margin-top: 0.6rem; font-size: 0.85rem; }
</style>
</head>
<body>
<div id="loading">
    <h1>Ball-Balancer</h1>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="status">Loading...</div>
</div>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<script>
var Module = {
    canvas: document.getElementById('canvas'),
    setStatus: function(text) {
        var s = document.getElementById('status');
        if (s) s.textContent = text;
        // Parse progress from "Downloading data... (X/Y)"
        var m = text.match(/([0-9.]+)\/([0-9.]+)/);
        if (m) {
            var pct = (parseFloat(m[1]) / parseFloat(m[2]) * 100).toFixed(0);
            var fill = document.getElementById('progress-fill');
            if (fill) fill.style.width = pct + '%';
        }
        if (text === '') {
            // Done loading
            var loading = document.getElementById('loading');
            if (loading) {
                loading.style.opacity = '0';
                setTimeout(function() { loading.style.display = 'none'; }, 300);
            }
        }
    },
    onRuntimeInitialized: function() {
        // Resize canvas to match CSS layout
        resizeCanvas();
    }
};

function resizeCanvas() {
    var c = document.getElementById('canvas');
    var dpr = window.devicePixelRatio || 1;
    c.width = window.innerWidth * dpr;
    c.height = window.innerHeight * dpr;
}

window.addEventListener('resize', resizeCanvas);
</script>
{{{ SCRIPT }}}
</body>
</html>
